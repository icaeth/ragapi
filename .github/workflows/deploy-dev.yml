name: Deploy to Dev
on:
  push:
    branches: [dev]

jobs:
  deploy_dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: icaeth/${{ github.event.repository.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      
      # Resto de los pasos con configuraciones de dev
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            mkdir -p yaml/${{ github.event.repository.name }}
            cd yaml/${{ github.event.repository.name }}
            touch .env
            printf "NGINX_CONTAINER=${{ github.event.repository.name }}\nVIRTUAL_HOST=devrag.esvanguardia.cl\nLETSENCRYPT_EMAIL=capitan23@samai.cl\nIMAGE=${{ steps.meta.outputs.tags }}\nOPENAI_API_KEY=${{ secrets.OPENAI }}" > .env
      
      - name: Copy files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          source: "docker-compose.yaml, nginx.conf, default.conf"
          target: yaml/${{ github.event.repository.name }}
      
      - name: Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            cd yaml/${{ github.event.repository.name }}
            docker-compose up -d